<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Immeuble de copropriété résidentielle">
  <defs>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8FD8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="windows" width="90" height="110" patternUnits="userSpaceOnUse">
      <rect width="90" height="110" fill="none"/>
      <rect x="14" y="14" width="62" height="82" rx="4" fill="#F8FAFC" fill-opacity="0.75"/>
      <rect x="14" y="14" width="62" height="82" rx="4" fill="#2B4D7F" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#skyC)"/>
  <rect x="0" y="620" width="1600" height="380" fill="#0F172A" opacity="0.3"/>
  <!-- Building blocks -->
  <rect x="120" y="260" width="520" height="700" fill="#1E3A5F"/>
  <rect x="140" y="290" width="480" height="600" fill="url(#windows)"/>
  <rect x="700" y="140" width="420" height="820" fill="#2B4D7F"/>
  <rect x="720" y="170" width="380" height="720" fill="url(#windows)"/>
  <rect x="1180" y="360" width="340" height="600" fill="#1E3A5F"/>
  <rect x="1200" y="390" width="300" height="500" fill="url(#windows)"/>
  <rect x="0" y="940" width="1600" height="60" fill="#0F172A"/>
</svg>
