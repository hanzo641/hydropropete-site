<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Terrasse en dallage extérieur">
  <defs>
    <linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8FD8"/>
      <stop offset="100%" stop-color="#2B4D7F"/>
    </linearGradient>
    <pattern id="dalles" width="180" height="120" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <rect width="176" height="116" x="2" y="2" rx="6" fill="#CBD5E1"/>
      <rect width="176" height="116" x="2" y="2" rx="6" fill="#0F172A" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#skyT)"/>
  <rect y="360" width="1600" height="640" fill="url(#dalles)"/>
  <rect y="360" width="1600" height="640" fill="#0F172A" fill-opacity="0.08"/>
  <!-- Sun -->
  <circle cx="1300" cy="180" r="110" fill="#F8FAFC" opacity="0.9"/>
  <!-- Plants -->
  <g transform="translate(150,540)">
    <ellipse cx="0" cy="220" rx="70" ry="20" fill="#0F172A" opacity="0.15"/>
    <rect x="-40" y="140" width="80" height="90" rx="10" fill="#1E3A5F"/>
    <path d="M0 140 C-30 80 -50 40 -70 0 M0 140 C10 70 40 30 70 -10 M0 140 C0 60 0 20 0 -20" stroke="#F8FAFC" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g transform="translate(1420,600)">
    <ellipse cx="0" cy="180" rx="60" ry="18" fill="#0F172A" opacity="0.15"/>
    <rect x="-34" y="110" width="68" height="80" rx="8" fill="#1E3A5F"/>
    <path d="M0 110 C-24 60 -40 30 -56 0 M0 110 C8 55 32 25 56 -6" stroke="#F8FAFC" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
