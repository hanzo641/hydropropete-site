<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nettoyage professionnel de tapis à Pau">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2B4D7F"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgT)"/>

  <circle cx="1300" cy="240" r="280" fill="#5A8FD8" opacity="0.16"/>
  <circle cx="240" cy="820" r="220" fill="#5A8FD8" opacity="0.12"/>

  <!-- Rug outline with border pattern -->
  <g>
    <rect x="380" y="300" width="840" height="500" rx="14" fill="#F8FAFC" opacity="0.94"/>
    <rect x="420" y="340" width="760" height="420" rx="8" fill="none" stroke="#2B4D7F" stroke-width="6" opacity="0.4"/>
    <rect x="460" y="380" width="680" height="340" rx="4" fill="none" stroke="#5A8FD8" stroke-width="4" opacity="0.5"/>

    <!-- Diamond motif in the center -->
    <g fill="#5A8FD8" opacity="0.55">
      <polygon points="800,440 860,550 800,660 740,550"/>
    </g>
    <g fill="#2B4D7F" opacity="0.35">
      <polygon points="800,480 830,550 800,620 770,550"/>
    </g>

    <!-- Corner tassels -->
    <g stroke="#94A3B8" stroke-width="4" opacity="0.5">
      <line x1="380" y1="320" x2="360" y2="320"/>
      <line x1="380" y1="340" x2="360" y2="340"/>
      <line x1="380" y1="360" x2="360" y2="360"/>
      <line x1="1220" y1="320" x2="1240" y2="320"/>
      <line x1="1220" y1="340" x2="1240" y2="340"/>
      <line x1="1220" y1="360" x2="1240" y2="360"/>
    </g>
  </g>

  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="300" cy="220" r="8"/>
    <circle cx="1280" cy="780" r="6"/>
    <circle cx="1350" cy="500" r="9"/>
    <circle cx="220" cy="600" r="6"/>
  </g>
</svg>
