  <path d="M1420 860 C1400 780 1360 740 1330 700 M1420 860 C1440 770 1470 730 1500 690 M1420 860 C1420 760 1420 700 1420 660" stroke="#2B4D7F" stroke-width="10" fill="none" stroke-linecap="round"/>
