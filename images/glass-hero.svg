<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Façade vitrée d'un immeuble moderne au crépuscule">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2B4D7F"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8FD8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g opacity="0.9">
    <!-- Window grid representing a glass building facade -->
    <g id="grid"></g>
  </g>
  <g>
    <!-- generated grid of panes -->
    <g fill="url(#pane)" stroke="#E2E8F0" stroke-opacity="0.15">
      <!-- rows x cols manually laid out -->
    </g>
  </g>
  <g>
    <g transform="translate(80,60)">
      <g id="cols">
        <!-- 18 columns x 12 rows of panes -->
      </g>
    </g>
  </g>
